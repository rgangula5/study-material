<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Material — CSS · React · JS · TS</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff; --green:#3fb950;
    --red:#f85149; --yellow:#d29922;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  header{background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0;}
  .htop{display:flex;align-items:center;gap:12px;padding:9px 16px;}
  .htop h1{font-size:15px;margin:0;font-weight:600;}
  .htop .sp{margin-left:auto;}
  .htop button{margin-left:6px;}
  .tabs{display:flex;gap:4px;padding:0 12px;}
  .tab{padding:9px 16px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;user-select:none;}
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab .cnt{font-size:11px;color:var(--muted);font-weight:500;}
  button{font-family:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);cursor:pointer;font-weight:500;}
  button:hover{background:#262c38;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:600;}
  button.edit.on{background:var(--yellow);border-color:var(--yellow);color:#1a1200;}
  button.danger{color:var(--red);border-color:rgba(248,81,73,.4);background:rgba(248,81,73,.08);}
  button.small{font-size:12px;padding:4px 9px;}

  .layout{display:flex;flex:1;min-height:0;}
  aside{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
    display:flex;flex-direction:column;}
  .search{padding:8px;border-bottom:1px solid var(--border);}
  .search input{width:100%;padding:8px 10px;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:6px;font-size:13px;outline:none;}
  .search input:focus{border-color:var(--accent);}
  .tlist{overflow-y:auto;flex:1;padding-bottom:10px;}
  .titem{padding:9px 14px;cursor:pointer;font-size:13px;line-height:1.4;border-left:3px solid transparent;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .titem:hover{background:var(--panel2);}
  .titem.active{background:var(--panel2);border-left-color:var(--accent);color:var(--text);font-weight:600;}
  .addtopic{margin:8px;}

  main{flex:1;overflow-y:auto;min-width:0;}
  .content{max-width:1000px;margin:0 auto;padding:22px 26px 80px;}
  .topic-section{padding:14px 0 22px;border-bottom:1px solid var(--border);scroll-margin-top:14px;}
  .topic-section:last-child{border-bottom:none;}
  .topic-title{font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.3;scroll-margin-top:14px;}
  .topic-title-input{font-size:22px;font-weight:700;width:100%;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-bottom:8px;}
  .tab-crumb{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
  .block{margin:12px 0;position:relative;}
  .block p{margin:0;line-height:1.65;font-size:15px;white-space:pre-wrap;word-break:break-word;}
  pre.code{margin:0;background:#010409;border:1px solid var(--border);border-radius:8px;
    padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.55;
    white-space:pre;overflow-x:auto;tab-size:2;color:var(--text);}
  .code-wrap{position:relative;}
  .code-lang{position:absolute;top:6px;right:6px;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);background:var(--panel);padding:2px 7px;border-radius:5px;border:1px solid var(--border);}
  .code-copy{position:absolute;top:6px;right:64px;font-size:11px;padding:2px 8px;opacity:.75;}
  .code-copy:hover{opacity:1;}

  /* edit mode */
  .edit-block{border:1px dashed var(--border);border-radius:8px;padding:8px;margin:10px 0;background:var(--panel);}
  .eb-head{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .eb-head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;}
  .eb-head .sp{margin-left:auto;}
  .eb-head select{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;
    font-size:12px;padding:3px 6px;}
  textarea.ed{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:8px 10px;font-size:14px;line-height:1.6;resize:vertical;outline:none;}
  textarea.ed.mono{font-family:var(--mono);font-size:13px;white-space:pre;overflow-wrap:normal;tab-size:2;}
  textarea.ed:focus{border-color:var(--accent);}
  .addblock{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--border);}
  .empty{color:var(--muted);font-size:14px;padding:20px 0;}
  .hint{font-size:11px;color:var(--muted);}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;}
  .toast.show{opacity:1;}
  @media(max-width:760px){aside{width:100%;position:absolute;z-index:10;height:100%;display:none;}
    aside.open{display:flex;} .menu-btn{display:inline-block!important;}}
  .menu-btn{display:none;}
</style>
</head>
<body>
<header>
  <div class="htop">
    <button class="menu-btn small" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>
    <h1>Study Material</h1>
    <span class="sp"></span>
    <button class="edit" id="editBtn" onclick="toggleEdit()">✏️ Edit</button>
    <button class="small" onclick="exportData()" title="Download data.json to save/commit">⬇ Export</button>
    <button class="small" onclick="document.getElementById('importFile').click()" title="Load a data.json">⬆ Import</button>
    <button class="small" onclick="resetData()" title="Discard local edits, reload published">↺ Reset</button>
    <input type="file" id="importFile" accept="application/json" hidden onchange="importData(event)" />
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="layout">
  <aside>
    <div class="search"><input id="search" placeholder="Search topics…" oninput="renderTopics()" /></div>
    <div class="tlist" id="tlist"></div>
    <button class="primary addtopic" id="addTopicBtn" onclick="addTopic()">+ Add topic</button>
  </aside>
  <main id="main" onscroll="onScrollSpy()"><div class="content" id="content"></div></main>
</div>
<div class="toast" id="toast"></div>

<script>
const LS_KEY='sm_data_v1';
let DATA=null, activeTab=0, activeTopic={}, editMode=false;
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);}

async function load(){
  const local=localStorage.getItem(LS_KEY);
  if(local){ try{ DATA=JSON.parse(local); }catch{ DATA=null; } }
  if(!DATA){
    const res=await fetch('data.json?ts='+Date.now());
    DATA=await res.json();
  }
  // default active topic per tab
  DATA.tabs.forEach((tb,i)=>{ if(activeTopic[i]==null) activeTopic[i]=tb.topics.length?tb.topics[0].id:null; });
  renderTabs(); renderTopics(); renderContent();
}

function renderTabs(){
  const c=$('#tabs'); c.innerHTML='';
  DATA.tabs.forEach((tb,i)=>{
    const t=el('div','tab'+(i===activeTab?' active':''));
    t.innerHTML=tb.label+' <span class="cnt">'+tb.topics.length+'</span>';
    t.onclick=()=>{activeTab=i;renderTabs();renderTopics();renderContent();};
    c.appendChild(t);
  });
}

function curTab(){return DATA.tabs[activeTab];}
function curTopic(){const id=activeTopic[activeTab];return curTab().topics.find(t=>t.id===id)||curTab().topics[0]||null;}

function renderTopics(){
  const list=$('#tlist'); list.innerHTML='';
  const q=($('#search').value||'').toLowerCase();
  const curId=activeTopic[activeTab];
  curTab().topics.forEach(tp=>{
    if(q && !(tp.title.toLowerCase().includes(q) || tp.blocks.some(b=>(b.v||'').toLowerCase().includes(q)))) return;
    const it=el('div','titem'+(tp.id===curId?' active':''),tp.title||'(untitled)');
    it.dataset.id=tp.id;
    it.onclick=()=>{scrollToTopic(tp.id);document.querySelector('aside').classList.remove('open');};
    list.appendChild(it);
  });
  $('#addTopicBtn').style.display=editMode?'':'none';
}

function scrollToTopic(id){
  const sec=document.querySelector('.topic-section[data-id="'+CSS.escape(id)+'"]');
  if(sec){ sec.scrollIntoView({behavior:'smooth',block:'start'}); setActive(id); }
}
function setActive(id){
  if(activeTopic[activeTab]===id) return;
  activeTopic[activeTab]=id;
  document.querySelectorAll('#tlist .titem').forEach(it=>it.classList.toggle('active',it.dataset.id===id));
  // keep active item visible in the sidebar
  const a=document.querySelector('#tlist .titem.active'); if(a) a.scrollIntoView({block:'nearest'});
}
let spyTicking=false;
function onScrollSpy(){
  if(spyTicking) return; spyTicking=true;
  requestAnimationFrame(()=>{
    spyTicking=false;
    const secs=document.querySelectorAll('.topic-section');
    let curId=null;
    const top=$('#main').getBoundingClientRect().top+90;
    secs.forEach(s=>{ if(s.getBoundingClientRect().top<=top) curId=s.dataset.id; });
    if(!curId && secs.length) curId=secs[0].dataset.id;
    if(curId) setActive(curId);
  });
}

function renderContent(scrollTop){
  const c=$('#content'); c.innerHTML='';
  c.appendChild(el('div','tab-crumb',curTab().label));
  const topics=curTab().topics;
  if(!topics.length){ c.appendChild(el('div','empty','No topics yet. Turn on ✏️ Edit and click "+ Add topic".')); return; }
  topics.forEach(tp=>{
    const sec=el('section','topic-section'); sec.dataset.id=tp.id;
    if(editMode){
      const ti=el('input','topic-title-input'); ti.value=tp.title;
      ti.oninput=()=>{tp.title=ti.value;save();
        const it=document.querySelector('#tlist .titem[data-id="'+CSS.escape(tp.id)+'"]'); if(it)it.textContent=ti.value;};
      sec.appendChild(ti);
    } else {
      sec.appendChild(el('h2','topic-title',tp.title));
    }
    tp.blocks.forEach((b,idx)=> sec.appendChild(editMode?editBlock(tp,b,idx):viewBlock(b)));
    if(!tp.blocks.length && !editMode) sec.appendChild(el('div','empty','(empty topic)'));
    if(editMode){
      const bar=el('div','addblock');
      const at=el('button','small','+ Text'); at.onclick=()=>{tp.blocks.push({t:'text',v:''});save();renderContent(getScroll());};
      const ac=el('button','small','+ Code'); ac.onclick=()=>{tp.blocks.push({t:'code',lang:'js',v:''});save();renderContent(getScroll());};
      const sp=el('span','sp'); sp.style.flex='1';
      const del=el('button','small danger','🗑 Delete topic'); del.onclick=()=>deleteTopic(tp);
      bar.appendChild(at);bar.appendChild(ac);bar.appendChild(sp);bar.appendChild(del);
      sec.appendChild(bar);
    }
    c.appendChild(sec);
  });
  if(scrollTop!=null) $('#main').scrollTop=scrollTop; else $('#main').scrollTop=0;
  onScrollSpy();
}
function getScroll(){return $('#main').scrollTop;}

function viewBlock(b){
  const w=el('div','block');
  if(b.t==='code'){
    const cw=el('div','code-wrap');
    const pre=el('pre','code'); pre.textContent=b.v;
    const lang=el('span','code-lang',b.lang||'code');
    const cp=el('button','code-copy small','Copy');
    cp.onclick=()=>{navigator.clipboard.writeText(b.v);cp.textContent='Copied!';setTimeout(()=>cp.textContent='Copy',1000);};
    cw.appendChild(pre);cw.appendChild(lang);cw.appendChild(cp);
    w.appendChild(cw);
  } else {
    const p=el('p'); p.textContent=b.v; w.appendChild(p);
  }
  return w;
}

function autosize(ta){ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight+2,600)+'px';}
function editBlock(tp,b,idx){
  const w=el('div','edit-block');
  const head=el('div','eb-head');
  head.appendChild(el('span','lbl',b.t==='code'?'Code':'Text'));
  if(b.t==='code'){
    const sel=document.createElement('select');
    ['js','ts','jsx','tsx','css','scss','html','bash','json','text'].forEach(l=>{
      const o=document.createElement('option');o.value=l;o.textContent=l;if((b.lang||'js')===l)o.selected=true;sel.appendChild(o);});
    sel.onchange=()=>{b.lang=sel.value;save();};
    head.appendChild(sel);
  }
  const sp=el('span','sp');head.appendChild(sp);
  const up=el('button','small','↑');up.onclick=()=>{if(idx>0){[tp.blocks[idx-1],tp.blocks[idx]]=[tp.blocks[idx],tp.blocks[idx-1]];save();renderContent();}};
  const dn=el('button','small','↓');dn.onclick=()=>{if(idx<tp.blocks.length-1){[tp.blocks[idx+1],tp.blocks[idx]]=[tp.blocks[idx],tp.blocks[idx+1]];save();renderContent();}};
  const rm=el('button','small danger','✕');rm.onclick=()=>{tp.blocks.splice(idx,1);save();renderContent();};
  head.appendChild(up);head.appendChild(dn);head.appendChild(rm);
  w.appendChild(head);
  const ta=el('textarea','ed'+(b.t==='code'?' mono':''));ta.value=b.v;
  ta.oninput=()=>{b.v=ta.value;save();if(b.t!=='code')autosize(ta);};
  w.appendChild(ta);
  setTimeout(()=>{if(b.t!=='code')autosize(ta);else ta.style.height=Math.min(Math.max(b.v.split('\n').length*20+20,80),600)+'px';},0);
  return w;
}

function toggleEdit(){
  const id=activeTopic[activeTab];               // topic you're currently on
  editMode=!editMode;
  $('#editBtn').classList.toggle('on',editMode);
  renderTopics();renderContent();
  if(id) setTimeout(()=>{
    const sec=document.querySelector('.topic-section[data-id="'+CSS.escape(id)+'"]');
    if(sec){ sec.scrollIntoView({block:'start'}); setActive(id);
      const f=sec.querySelector('.topic-title-input'); if(f) f.focus({preventScroll:true}); }
  },0);
  toast(editMode?'Edit mode on — changes save automatically':'Edit mode off');
}

function addTopic(){
  const title=prompt('New topic title:'); if(!title) return;
  const base=title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'topic';
  let id=base,n=1; const ids=new Set(curTab().topics.map(t=>t.id)); while(ids.has(id)) id=base+'-'+(n++);
  const tp={id,title,blocks:[]}; curTab().topics.push(tp); activeTopic[activeTab]=id;
  save();renderTabs();renderTopics();renderContent();
  setTimeout(()=>scrollToTopic(id),0);
}
function deleteTopic(tp){
  if(!confirm('Delete topic "'+tp.title+'"? This removes it from your local copy.')) return;
  const arr=curTab().topics; const i=arr.findIndex(t=>t.id===tp.id); if(i>=0)arr.splice(i,1);
  activeTopic[activeTab]=arr.length?arr[0].id:null; save();renderTabs();renderTopics();renderContent();
}

function exportData(){
  const blob=new Blob([JSON.stringify(DATA,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();
  toast('Exported data.json — commit it to publish your changes');
}
function importData(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{DATA=JSON.parse(r.result);activeTab=0;activeTopic={};save();load();toast('Imported');}catch{toast('Invalid JSON');}};
  r.readAsText(f); ev.target.value='';
}
function resetData(){
  if(!confirm('Discard your local edits and reload the published version?'))return;
  localStorage.removeItem(LS_KEY);DATA=null;activeTab=0;activeTopic={};location.reload();
}

load();
</script>
</body>
</html>
